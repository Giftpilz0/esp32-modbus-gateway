; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
    default_envs = esp32debug

[env]
    platform = espressif32
    framework = arduino
    lib_deps = 
        https://github.com/tzapu/WiFiManager#4131fe617d01d746677e8b909379597162c2ca58
        https://github.com/ESP32Async/ESPAsyncWebServer#f443b9a95fbdeae789c8a2337f3783be979bb814
        https://github.com/eModbus/eModbus.git#6e4200d1a5213cf3004d60855c880604391f50af
        SPI
    build_flags = -Wall -Werror -DLOG_LEVEL=LOG_LEVEL_DEBUG
    monitor_speed = 115200

[env:esp32release]
    board = esp32dev
    build_flags = ${env.build_flags}

[env:esp32debug]
    board = esp32dev
    build_flags = ${env.build_flags}

[env:olimex-poe]
    board = esp32-poe
    build_flags = ${env.build_flags} -DRX_PIN=14 -DTX_PIN=5
    upload_port = COM9
    monitor_port = COM9

[env:d1mini]
    board = wemos_d1_mini32
    build_flags = ${env.build_flags}
